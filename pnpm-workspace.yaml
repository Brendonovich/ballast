  "@effect/vitest": 4.0.6
  alchemy: 2.0.0-beta.84
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@cloudflare/workers-types": 5.20261012.1
  wrangler: 4.126.0
  "@types/node": 24.13.3
  "@types/ws": 8.18.2
  rolldown: 1.2.19
  ws: 8.23.0
  vitest: ^4.1.0
  solid-js: 1.9.17
  "@solidjs/router": 1.0.0
  vite: 8.3.8
  vite-plugin-solid: 2.11.17
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@playwright/test": 1.65.1
  electron: 44.9.1
  electron-builder: 26.15.7
  electron-updater: 6.8.9
  esbuild: 0.28.1
