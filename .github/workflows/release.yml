name: release

# Builds, signs, notarizes and publishes Ballast desktop (macOS arm64, Windows x64) to Ballast's
# release service (apps/release), where the app updates itself from (apps/desktop/src/main/update.ts).
# docs/releasing.md covers the one-time setup and how to cut a release.
#
# - pull_request: builds both platforms unsigned and tests the Windows setup; signs and publishes nothing.
# - push to dev: publishes 0.0.0-dev-<run number> on the dev channel.
# - workflow_dispatch on dev with a version: publishes it on the stable channel and tags v<version>.
#
# Security boundary (as OpenCode's and Rune's release workflows):
# - build and package jobs run repository code with no environment, secrets or id-token.
# - sign and publish jobs run in the `release` environment, check out only /.github/release/, and
#   treat artifacts as data, each checked against the SHA256SUMS digest the job that made it reported.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (X.Y.Z)
        required: true

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('stable {0}', inputs.version)
  || github.event_name == 'push' && 'dev'
  || format('pr #{0}', github.event.pull_request.number) }}

permissions:
  contents: read

# A newer dev or PR build cancels an older one still running; a stable release always finishes.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('stable-{0}', inputs.version) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  # The release service (apps/release, `pnpm --filter @ballast/release deploy`). Builds stamp it as
  # their update URL, so it must stay stable.
  RELEASE: ${{ vars.BALLAST_RELEASE_ORIGIN || 'https://ballast-release.brendonovich.workers.dev/release' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      channel: ${{ steps.plan.outputs.channel }}
      build-channel: ${{ steps.plan.outputs.build-channel }}
      version: ${{ steps.plan.outputs.version }}
      sign: ${{ steps.plan.outputs.sign }}
      # Windows is Authenticode-signed only once Azure Artifact Signing is configured; until then the
      # setup ships unsigned (SmartScreen warns; the updater still checks its SHA-256).
      sign-windows: ${{ steps.plan.outputs.sign == 'true' && vars.AZURE_CLIENT_ID != '' }}
      notes-url: ${{ steps.plan.outputs.notes-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: bash .github/release/plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          INPUT_VERSION: ${{ inputs.version }}

  # ---- Build: repository code; no environment, secrets or id-token ------------------------------

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, host: macos-15 }
          - { target: windows-x64, host: windows-2025 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      BALLAST_VERSION: ${{ needs.plan.outputs.version }}
      BALLAST_CHANNEL: ${{ needs.plan.outputs.build-channel }}
      BALLAST_RELEASE_ORIGIN: ${{ vars.BALLAST_RELEASE_ORIGIN || 'https://ballast-release.brendonovich.workers.dev/release' }}
    # One output per target: a matrix job's outputs are shared by its legs.
    outputs:
      digest-macos-arm64: ${{ steps.digest.outputs.digest-macos-arm64 }}
      digest-windows-x64: ${{ steps.digest.outputs.digest-windows-x64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - &setup-pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - &install
        name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: matrix.target == 'macos-arm64'
        run: pnpm typecheck
      - name: Test the desktop shell
        run: pnpm --filter @ballast/desktop test
      - name: Pack
        run: node apps/desktop/script/pack.mjs --out "$RUNNER_TEMP/build"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-${{ matrix.target }}
          path: ${{ runner.temp }}/build
          retention-days: "7"
      - id: digest
        run: echo "digest-${{ matrix.target }}=${{ steps.upload.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # The setup around the unpacked app: the signed one when this run signs, else the unsigned build.
  # Repository code, so a build job after sign-windows (as OpenCode's
  # build-desktop-windows-installer); sign-windows-setup signs the setup next.
  package-windows:
    needs: [plan, build, sign-windows]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.plan.outputs.sign-windows != 'true') }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BALLAST_VERSION: ${{ needs.plan.outputs.version }}
      BALLAST_CHANNEL: ${{ needs.plan.outputs.build-channel }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - *setup-pnpm
      - *setup-node
      - *install
      - if: needs.plan.outputs.sign-windows == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-windows-app
          digests: sign-windows-app=${{ needs.sign-windows.outputs.digest }}
      - if: needs.plan.outputs.sign-windows != 'true'
        uses: ./.github/release/download
        with:
          pattern: build-windows-x64
          digests: build-windows-x64=${{ needs.build.outputs.digest-windows-x64 }}
      - name: Pack the setup
        run: |
          if [ "${{ needs.plan.outputs.sign-windows }}" = true ]; then app="$RUNNER_TEMP/in/sign-windows-app/app"; else app="$RUNNER_TEMP/in/build-windows-x64/app"; fi
          node apps/desktop/script/pack.mjs --installer "$app" --out "$RUNNER_TEMP/setup"
      - name: Test the setup
        shell: pwsh
        run: |
          $channel = if ($env:BALLAST_CHANNEL) { $env:BALLAST_CHANNEL } else { 'stable' }
          apps/desktop/script/test-installer.ps1 -Setup "$env:RUNNER_TEMP/setup/Ballast-$env:BALLAST_VERSION-windows-x64-setup.exe" -Channel $channel
      - id: upload
        uses: ./.github/release/upload
        with:
          name: setup-windows-x64
          path: ${{ runner.temp }}/setup
          retention-days: "7"

  # ---- Sign: release environment; only .github/release/ is checked out --------------------------

  sign-macos:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.sign == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - &checkout-release
        name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: build-macos-arm64
          digests: build-macos-arm64=${{ needs.build.outputs.digest-macos-arm64 }}
      - name: Import the certificate and notary key
        run: bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      - name: Sign, notarize and staple
        run: bash .github/release/sign-macos.sh "$RUNNER_TEMP/in/build-macos-arm64/Ballast.app.zip" "$RUNNER_TEMP/out"
        env:
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-macos
          path: ${{ runner.temp }}/out

  # Authenticode-signs every program, library and native addon of the unpacked app (Ballast.exe,
  # Electron's DLLs, and the agent service's .node addons and tsgo.exe) through Azure Artifact
  # Signing, over GitHub OIDC into the release environment's AZURE_* values.
  sign-windows:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.sign-windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: build-windows-x64
          digests: build-windows-x64=${{ needs.build.outputs.digest-windows-x64 }}
      - name: Lay out the app
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/work" && cp -R "$temp/in/build-windows-x64/app" "$temp/work/app"
      - &azure-login
        name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - &azure-sign
        name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ runner.temp }}\work
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Ballast
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - &azure-verify
        name: Check the signatures
        shell: pwsh
        run: .github/release/verify-windows.ps1 -Folders "$env:RUNNER_TEMP/work"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-windows-app
          path: ${{ runner.temp }}/work

  sign-windows-setup:
    needs: [plan, package-windows]
    if: ${{ !cancelled() && needs.plan.outputs.sign-windows == 'true' && needs.package-windows.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: setup-windows-x64
          digests: setup-windows-x64=${{ needs.package-windows.outputs.digest }}
      - name: Gather the setup
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$temp/work" && cp "$temp"/in/setup-windows-x64/*.exe "$temp/work/"
      - *azure-login
      - *azure-sign
      - *azure-verify
      - id: upload
        uses: ./.github/release/upload
        with:
          name: sign-windows-setup
          path: ${{ runner.temp }}/work

  # ---- Publish: release environment; OIDC only ----------------------------------------------------
  # A channel has one current release and publishing replaces it whole, so macOS and Windows go out
  # together, or not at all.

  publish:
    needs: [plan, sign-macos, package-windows, sign-windows-setup]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.sign == 'true' && needs.sign-macos.result == 'success'
      && (needs.sign-windows-setup.result == 'success'
        || (needs.plan.outputs.sign-windows != 'true' && needs.package-windows.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      NOTES_URL: ${{ needs.plan.outputs.notes-url }}
    steps:
      - *checkout-release
      - uses: ./.github/release/download
        with:
          pattern: sign-macos
          digests: sign-macos=${{ needs.sign-macos.outputs.digest }}
          folder: macos
      - if: needs.plan.outputs.sign-windows == 'true'
        uses: ./.github/release/download
        with:
          pattern: sign-windows-setup
          digests: sign-windows-setup=${{ needs.sign-windows-setup.outputs.digest }}
          folder: windows
      - if: needs.plan.outputs.sign-windows != 'true'
        uses: ./.github/release/download
        with:
          pattern: setup-windows-x64
          digests: setup-windows-x64=${{ needs.package-windows.outputs.digest }}
          folder: windows
      - name: Publish
        run: |
          macos="$RUNNER_TEMP/macos/sign-macos"
          windows=$(echo "$RUNNER_TEMP"/windows/*/)
          jq -n --arg channel "$CHANNEL" --arg version "$VERSION" --arg notes_url "$NOTES_URL" \
            '{channel: $channel, version: $version, notes_url: $notes_url, distributions: [{kind: "direct"}]}' \
            > "$RUNNER_TEMP/release.json"
          bash .github/release/release-client.sh publish \
            --app ballast \
            --artifact desktop \
            --release "$RUNNER_TEMP/release.json" \
            --target "macos-arm64=$macos/Ballast-$VERSION-macos-arm64.zip" \
            --target "macos-arm64-dmg=$macos/Ballast-$VERSION-macos-arm64.dmg" \
            --target "windows-x64-setup=$windows/Ballast-$VERSION-windows-x64-setup.exe" \
            --out "$RUNNER_TEMP/manifest.json" \
            --verify-downloads
          {
            echo "### Ballast $VERSION on $CHANNEL"
            for target in macos-arm64-dmg windows-x64-setup; do echo "- $RELEASE/ballast/desktop/$CHANNEL/$target"; done
            echo '```json'; cat "$RUNNER_TEMP/manifest.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The notes URL of a stable release.
  tag:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.channel == 'stable' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Tag and create the GitHub release
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION already has a release."
            exit 0
          fi
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Ballast $VERSION" --generate-notes \
            --notes "Download: [macOS (Apple silicon)]($RELEASE/ballast/desktop/stable/macos-arm64-dmg) · [Windows (x64)]($RELEASE/ballast/desktop/stable/windows-x64-setup)"
