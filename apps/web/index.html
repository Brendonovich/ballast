<!doctype html>
<html lang="en" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>Ballast</title>
    <script>
      (function () {
        try {
          var setting = localStorage.getItem("ballast.theme") || "system";
          var dark =
            setting === "dark" ||
            (setting === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #161616;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }
      html[data-color-scheme="dark"] body {
        background: #161616;
        color: #ededed;
      }
      #boot {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        opacity: 0.55;
      }
      #boot span {
        width: 12px;
        height: 12px;
        border: 1.5px solid currentColor;
        border-top-color: transparent;
        border-radius: 999px;
        animation: boot-spin 700ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span></span>Starting Ballast…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
