<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ballast</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0d10; --panel: #141820; --text: #e7e9ee; --muted: #9aa3b2; --accent: #8ab4ff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 50% -20%, #1a2130, var(--bg));
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(560px, calc(100vw - 48px)); }
      .card { background: var(--panel); border: 1px solid #232a36; border-radius: 14px; padding: 28px; box-shadow: 0 24px 80px #0008; }
      h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #2a3242; border-top-color: var(--accent); display: inline-block; animation: spin 1s linear infinite; vertical-align: -4px; margin-right: 8px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 20px 0 0; font-size: 12px; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      .actions { display: flex; gap: 8px; margin-top: 22px; }
      button { font: inherit; border-radius: 8px; border: 1px solid #2a3242; background: #1b2130; color: var(--text); padding: 7px 12px; cursor: pointer; }
      button.primary { background: #24406f; border-color: #35588f; }
      button:hover { filter: brightness(1.12); }
      #error { color: #ff9f9f; margin-top: 12px; white-space: pre-wrap; }
      /* macOS hides the native title bar; keep the window draggable from the top. */
      .drag { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div class="drag" aria-hidden="true"></div>
    <main>
      <div class="card">
        <h1><span class="spinner"></span>Starting Ballast…</h1>
        <p id="summary">Looking for the background service.</p>
        <dl>
          <dt>Status</dt><dd id="phase">checking</dd>
          <dt>Version</dt><dd id="version">—</dd>
          <dt>PID</dt><dd id="pid">—</dd>
          <dt>Service URL</dt><dd id="url">—</dd>
          <dt>Data</dt><dd id="data">—</dd>
        </dl>
        <p id="error" hidden></p>
        <div class="actions">
          <button id="retry" class="primary" type="button">Retry</button>
          <button id="logs" type="button">Open logs</button>
        </div>
      </div>
    </main>
    <script src="./fallback.js"></script>
  </body>
</html>
